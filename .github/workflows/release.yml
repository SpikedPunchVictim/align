name: Release

# Publishes all four packages to npm when a `v*` tag is pushed.
#
# PREREQUISITE: each package must ALREADY exist on npm *and* have this repo's
# release.yml registered as a Trusted Publisher (npm package settings → Publishing
# access → Trusted Publisher). Until that one-time setup is done, publish the first
# version locally — see RELEASING.md. Trusted Publishing needs no NPM_TOKEN secret;
# the OIDC token below authenticates the publish and attaches provenance.
#
# Typical flow:
#   pnpm release:version <x.y.z>
#   ...then the three non-automated edits RELEASING.md Step 3 lists (migration-registry entry,
#      UPGRADING.md + recompiled notes, KNOWN_ALIGN_VERSIONS) — the last fails silently if skipped
#   git commit -am "release: v<x.y.z>"
#   git tag v<x.y.z> && git push --follow-tags

on:
  push:
    tags:
      - 'v*'

# id-token: write is what lets npm exchange a short-lived OIDC token for publish
# credentials (Trusted Publishing) and sign provenance attestations.
permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: build, verify, publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keep pinned in lockstep with package.json's "packageManager" field.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Fail fast if someone tagged v1.2.3 but forgot `pnpm release:version 1.2.3`.
      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./packages/core/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match packages/core version $pkg — run 'pnpm release:version $tag' and re-tag"
            exit 1
          fi
          echo "Releasing v$pkg"

      # Full gate set, same as CI — a release must clear everything a PR does.
      - name: Build all packages
        run: pnpm -r build

      - name: Typecheck all packages
        run: pnpm -r typecheck

      - name: Test all packages
        run: pnpm -r test

      - name: align check (self-dogfood)
        run: pnpm check

      # ADR 025 §6: "required before publish" — and until LEDGER D059 nothing enforced it. The
      # harness ran on `release: published` in ci.yml while this workflow publishes on the tag push,
      # so the two raced and npm could ship regardless of the result. It runs HERE now, ahead of the
      # publish step, so a red harness fails the job and no tarball leaves the runner.
      #
      # `integration:release` covers EVERY project (scripts/integration-all-projects.mjs) against
      # both targets, so it also carries the red/green calibration proof: ten scenarios pinned via
      # `expectFailOn` must go red against the real published 0.1.4, and run.mjs exits non-zero if
      # any of them passes. Minutes, paid once per release.
      - name: Cross-version integration harness (ADR 025 §6 — required before publish)
        run: pnpm integration:release

      # Keep the evidence for a release even when it passed — the artifacts are how a published
      # version's gate result stays inspectable after the fact.
      - name: Upload harness results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-integration-results
          path: |
            integration/results/*/
            !integration/results/.cache/
          retention-days: 90

      # pnpm publishes in topological order (core → plugin-typescript/agent → cli)
      # and rewrites `workspace:*` deps to the concrete version being published.
      # --no-git-checks: the tag checkout is a detached HEAD.
      # --provenance: attach a signed build-provenance attestation (needs id-token).
      - name: Publish to npm (Trusted Publishing + provenance)
        run: pnpm -r publish --access public --no-git-checks --provenance
