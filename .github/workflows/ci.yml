name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # ADR 025: the cross-version integration harness needs Docker-adjacent tooling and takes
  # minutes, so it does NOT run on every push/PR — it is manually dispatchable, for a pre-release
  # check on a branch.
  #
  # It does NOT run on a published Release. This comment claimed it did until 2026-08-20, and the
  # `integration` job below has always been `if: github.event_name == 'workflow_dispatch'` with no
  # `release:` trigger in this file. ADR 025 §6's "required before publish" gate is real, but it
  # lives in `release.yml`, which runs `pnpm integration:release`. Do not read this workflow as
  # that gate. `targets` defaults to the calibration pair
  # (`0.1.4,local`) so a manual run exercises both the ordinary gate (against `local`, the code
  # under review) AND the red/green `expectFailOn` proof (against the real published `0.1.4`) in
  # one invocation — see integration/README.md's "Enforcing the red/green proof" section.
  workflow_dispatch:
    inputs:
      project:
        description: 'project id (integration/projects/*.mjs) — leave EMPTY to run every project'
        # Empty by default (LEDGER D059). This used to default to 'nest', so a bare manual dispatch —
        # the "pre-release check on a branch" this workflow exists to offer — silently covered one
        # project of two and never ran the only integration coverage ADR 023 tier 2 has. Same shape
        # as D049, one level up: a gate whose DEFAULT under-covers is a gate nobody knows is partial.
        default: ''
        required: false
      targets:
        description: 'align versions to test, comma-separated (0.1.0-0.1.4, local)'
        default: '0.1.4,local'
        required: false
      scenarios:
        description: 'comma-separated scenario ids (default: every scenario for --project)'
        default: ''
        required: false
  # NO `release: published` trigger (LEDGER D059). It used to run the harness when a GitHub Release
  # was published, while `release.yml` publishes to npm on the TAG PUSH — two different events that
  # fire concurrently, so the harness never gated anything it was described as gating (ADR 025 §6:
  # "required before publish"). The gate now lives in `release.yml`, ahead of the publish step, where
  # a failure actually stops the release. Re-adding a trigger here would restore the duplicate
  # 25-minute run that can block nothing.

# Cancel superseded runs on the same ref so PR pushes don't queue stale jobs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: build, typecheck, test, check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to the exact version in package.json's "packageManager" field —
      # keep these in sync (do not float to a range here).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      # Pinned to the major version implied by package.json's "engines.node"
      # (">=20") and this repo's actual dev/runtime target (Node 24) — do not
      # use a floating tag like "lts/*".
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      - name: Typecheck all packages
        run: pnpm -r typecheck

      - name: Test all packages
        run: pnpm -r test

      # The dogfood that matters: align checking itself. This runs the real
      # `align` binary produced by the build step above (root "check" script
      # is `node packages/cli/dist/index.js check`) — align enforcing its own
      # architecture in CI, not a mock or a stub.
      - name: align check (self-dogfood)
        run: pnpm check

  # ADR 025: the cross-version integration harness. NOT part of the `ci` job above — it needs a
  # real `npm`/git-capable environment per scenario (each one installs a real align version into a
  # cloned copy of a real OSS project) and takes minutes, which is the wrong cost to pay on every
  # push. Runs on `workflow_dispatch` (manual pre-release check) and automatically when a GitHub
  # Release is published (ADR 025 §6: "required before publish").
  #
  # Runs directly with `node integration/run.mjs` rather than building/running
  # `integration/Dockerfile` — this runner already provides the exact pinned pnpm/Node versions the
  # rest of this workflow uses (see the Setup steps below, identical to the `ci` job's), so a
  # Docker layer buys reproducibility this environment already has, at the cost of an extra image
  # build on every dispatch. `integration/README.md`'s own words: "Works identically from a plain
  # `node integration/run.mjs` ... and from inside the Docker image" — the Dockerfile remains the
  # right tool for running the harness somewhere that DOESN'T already pin these versions (a local
  # dev machine, a different CI provider).
  integration:
    name: cross-version integration harness (ADR 025)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # 'local' targets pack the working tree (lib/version-install.mjs's `pnpm pack`) — the build
      # must exist before run.mjs's first 'local' install, same precondition as running it by hand.
      - name: Build all packages
        run: pnpm -r build

      # The harness's own unit tests, ahead of the harness (LEDGER D068/D069). The red/green
      # calibration check and the scenario-spec validator are the two pieces of this job whose
      # failure mode is a FALSE PASS, so they are gated before anything expensive runs.
      - name: Test the harness itself
        run: pnpm test:harness

      # Every project, DISCOVERED from integration/projects/ — never enumerated here.
      #
      # This step used to be two hardcoded `run.mjs --project <id>` invocations, which is the exact
      # defect `scripts/integration-all-projects.mjs` was written to close one level down (LEDGER
      # D012, then D049 when the mitigation turned out to be a sentence in CLAUDE.md asking a human
      # to remember a second line). A third project added to integration/projects/ would have been
      # absent from the release gate with nothing to notice — the failure mode is silence, not a red
      # run. Found by review 2026-08-20, in the same file whose own header comment cites D012.
      #
      # A manual dispatch can still narrow to one project (and optionally one scenario) for a fast,
      # targeted debug run; that path calls run.mjs directly because narrowing is the whole point.
      - name: Run harness — every project
        if: github.event.inputs.project == ''
        run: >
          node scripts/integration-all-projects.mjs
          --targets "${{ github.event.inputs.targets || '0.1.4,local' }}"
          ${{ github.event.inputs.scenarios != '' && format('--scenarios {0}', github.event.inputs.scenarios) || '' }}

      - name: Run harness — single project (manual dispatch only)
        if: github.event.inputs.project != ''
        run: >
          node integration/run.mjs --project "${{ github.event.inputs.project }}"
          --targets "${{ github.event.inputs.targets || '0.1.4,local' }}"
          ${{ github.event.inputs.scenarios != '' && format('--scenarios {0}', github.event.inputs.scenarios) || '' }}

      # Rich artifacts (ADR 025 §2) — uploaded on every run, not just failure, so a release's gate
      # result stays inspectable after the fact (steps.json/normalized.json/result.json/
      # summary.json per (target, scenario) pair, per integration/README.md).
      - name: Upload harness results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          # Excludes .cache/ (the cloned-project/node_modules/tarball cache — large, and not a
          # result artifact) — only the per-run timestamped output directories.
          path: |
            integration/results/*/
            !integration/results/.cache/
          retention-days: 30

# ---------------------------------------------------------------------------
# Downstream usage example (documentation only — this repo dogfoods align via
# the `pnpm check` step above, checking itself from source rather than the
# published package, so this is not a runnable job here).
#
# A CONSUMER repo would add a job like this to gate PRs on architecture
# conformance against the published `@spikedpunch/align-cli`:
#
#   pr-check:
#     name: align check
#     runs-on: ubuntu-latest
#     steps:
#       - uses: actions/checkout@v4
#       - uses: pnpm/action-setup@v4
#         with:
#           version: <pin to the consumer repo's packageManager version>
#       - uses: actions/setup-node@v4
#         with:
#           node-version: <pin to the consumer repo's engines.node>
#           cache: pnpm
#       - run: pnpm install --frozen-lockfile
#       - run: pnpm add -D @spikedpunch/align-cli   # or install globally / via npx
#       # --frozen-rules additionally fails the build if a doc-built ruleset
#       # (`align build`) has drifted from its lockfile since the last
#       # `align build --apply` — keeps docs-as-rules honest in CI.
#       - run: pnpm exec align check --frozen-rules
# ---------------------------------------------------------------------------
